<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Linkra · קישור נכנס, קובץ יוצא</title>
  <meta name="description" content="מדביקים קישור, מקבלים את התמונה או הסרטון באיכות המקורית." />
  <meta name="theme-color" content="#07060d" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..900&family=Heebo:wght@300..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="grid-lines" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Linkra">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4fa3"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
        <rect x="2" y="2" width="36" height="36" rx="11" fill="url(#bm)"/>
        <path d="M14 26.5 25.5 15M17.5 14.5h8.5v8.5" stroke="#07060d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span class="brand-name">Linkra</span>
    </a>
    <div class="live-pill" title="קבצים שחולצו">
      <span class="pulse"></span><span id="stat-files">0</span>&nbsp;קבצים
    </div>
    <button class="history-btn" id="open-history" type="button" aria-label="ההיסטוריה שלי">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 3"/></svg>
      <span class="hb-count" id="history-count" hidden>0</span>
    </button>
  </header>

  <main>
    <section class="hero" id="studio">
      <h1 class="headline">
        <span class="line">קישור נכנס.</span>
        <span class="line"><em class="gradient-text">קובץ יוצא.</em></span>
      </h1>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-glow" aria-hidden="true"></div>
        <div class="composer-inner">
          <div class="composer-row">
            <span class="site-chip" id="site-chip" hidden><i class="dot"></i><b></b></span>
            <textarea id="links" rows="1" placeholder="הדביקו קישור…" spellcheck="false" aria-label="קישור"></textarea>
            <span class="count-badge" id="count-badge" hidden></span>
            <button type="submit" class="cta" id="submit-btn" aria-label="חילוץ">
              <span class="cta-label">חלצו</span>
              <svg class="cta-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l-6 6 6 6"/></svg>
            </button>
          </div>
        </div>
        <div class="drop-overlay" aria-hidden="true">שחררו כאן</div>
      </form>

      <ol class="steps" aria-label="איך זה עובד">
        <li><span class="step-ico">⌘V</span>מדביקים</li>
        <li><span class="step-ico">✦</span>מחלצים</li>
        <li><span class="step-ico">↓</span>מורידים</li>
      </ol>

      <div class="recents" id="recents" hidden>
        <div class="recents-track" id="recents-track"></div>
        <button class="recents-all" id="recents-all" type="button">הכל</button>
      </div>

      <div id="jobs" class="jobs" aria-live="polite"></div>
    </section>

    <section class="platforms" aria-label="אתרים נתמכים">
      <div class="marquee"><div class="marquee-track" id="marquee"></div></div>
    </section>
  </main>

  <footer class="footer">
    <a class="bookmarklet" id="bookmarklet" href="#" title="גררו לסרגל הסימניות">⚡ Linkra לסרגל הסימניות</a>
    <span class="muted">קבצים נמחקים אחרי 7 ימים</span>
  </footer>

  <!-- history drawer -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-label="ההיסטוריה שלי" aria-hidden="true">
    <div class="drawer-head">
      <h2>ההיסטוריה שלי</h2>
      <button class="icon-btn" id="close-history" type="button" aria-label="סגירה">✕</button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="search" type="search" placeholder="חיפוש" />
    </label>
    <div class="chips" id="filters">
      <button class="chip active" data-filter="all" type="button">הכל</button>
      <button class="chip" data-filter="image" type="button">תמונות</button>
      <button class="chip" data-filter="video" type="button">סרטונים</button>
      <button class="chip" data-filter="starred" type="button">★</button>
    </div>
    <div class="history-list" id="history-list"></div>
    <p class="empty" id="history-empty" hidden>עוד אין כאן כלום</p>
  </aside>

  <!-- studio (tools for one file) -->
  <div class="studio" id="studio-modal" hidden>
    <div class="studio-panel" role="dialog" aria-modal="true" aria-label="סטודיו">
      <div class="studio-preview">
        <img id="studio-img" alt="" hidden />
        <video id="studio-video" controls playsinline hidden></video>
      </div>
      <div class="studio-side">
        <div class="studio-head">
          <h2>✨ סטודיו</h2>
          <button class="icon-btn" id="studio-close" type="button" aria-label="סגירה">✕</button>
        </div>
        <div class="tabs" id="studio-tabs" role="tablist"></div>
        <div class="tab-body" id="studio-body"></div>
      </div>
    </div>
  </div>

  <div class="toast-zone" id="toasts" aria-live="assertive"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <template id="job-template">
    <article class="job">
      <div class="job-head">
        <span class="site-chip"><i class="dot"></i><b class="site-name"></b></span>
        <a class="job-url" target="_blank" rel="noopener noreferrer" dir="ltr"></a>
        <span class="job-time"></span>
      </div>
      <ol class="timeline"></ol>
      <div class="job-msg" hidden></div>
      <div class="results"></div>
      <div class="job-actions" hidden>
        <a class="pill-btn zip-btn" download>⬇ הכל (ZIP)</a>
        <button class="pill-btn share-btn" type="button">🔗 שיתוף</button>
        <button class="pill-btn qr-btn" type="button">📱 לטלפון</button>
        <span class="modesty-badge" title="עבר סינון צניעות">✓ צנוע</span>
      </div>
    </article>
  </template>

  <script src="/assets/app.js" type="module"></script>
</body>
</html>
